{{- with .Params.password -}}
<script>
  (function () {
    const password = {{ . | jsonify | safeJS }};
    if (!password) return;
    const title = {{ $.Title | jsonify | safeJS }};
    if (prompt('password for ' + title) != password) {
      alert('wrong password！');
      if (history.length === 1) {
        window.opener = null;
        window.open('', '_self');
        window.close();
      } else {
        history.back();
      }
    }
  })();
</script>
{{- end -}}
