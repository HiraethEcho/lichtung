{{- $show := default true (default .Site.Params.ShowSiteSearch .Params.ShowSiteSearch) -}}
{{- if $show -}}
  <div class="sideblock" id="searchbox">
    <input
      id="searchInput"
      placeholder="{{- .Site.Params.SearchPlaceHolder | default (printf "search ↵") -}}"
      aria-label="search"
      type="search"
      autocomplete="off"
    />
    <ul id="searchResults" aria-label="search results"></ul>
  </div>
  {{- partial "utils/search-assets.html" . -}}
{{- end -}}
